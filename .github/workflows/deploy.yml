name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel any in-flight deploy from a previous push so we never have two
  # `docker compose up` racing on the same host.
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        # Fail with a clear, actionable message if any required secret is
        # missing. appleboy/ssh-action would otherwise complain with a
        # less helpful "Host required" error at job boot.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY_LEN: ${{ secrets.DEPLOY_SSH_KEY && secrets.DEPLOY_SSH_KEY != '' && 'set' || 'missing' }}
          PATH_SECRET: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in HOST USER PATH_SECRET; do
            v=$(eval echo "\$$name")
            if [ -z "$v" ]; then
              echo "::error::Secret DEPLOY_${name} is empty. Add it in Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          if [ "$KEY_LEN" != "set" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY is empty. Add it in Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            exit 1
          fi
          echo "All DEPLOY_* secrets present."

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        env:
          # Passed to the remote shell only when listed in `envs` below.
          # appleboy/ssh-action does not forward step env automatically.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,GIT_SHA
          script: |
            set -euo pipefail
            : "${DEPLOY_PATH:?DEPLOY_PATH must be set}"
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git reset --hard origin/main
            docker compose pull || true
            # Pass the commit SHA into both images so /build.txt (frontend)
            # carries a per-deploy stamp that VersionWatcher can detect.
            # Backend also needs to be rebuilt on every push: the previous
            # script only built frontend, which meant backend routes
            # (e.g. /api/llm-settings) lagged behind main until the next
            # manual rebuild. Any change under backend/ now triggers a
            # rebuild because the context hash differs.
            GIT_SHA="${GIT_SHA:-local}" docker compose build frontend
            GIT_SHA="${GIT_SHA:-local}" docker compose build backend
            docker compose up -d --force-recreate backend frontend
            docker compose up -d nginx
            # nginx resolves Compose service names when its config is loaded.
            # Backend recreation gives `backend` a new container IP, so keeping
            # nginx running without a reload can leave it proxying to the dead
            # address and return 502 even though the new backend is healthy.
            # A graceful reload refreshes DNS without replacing nginx itself
            # (replacing it could likewise stale the outer proxy's nginx IP).
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            docker image prune -f
            docker compose ps

